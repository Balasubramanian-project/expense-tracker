{% extends "base.html" %}

{% block title %}Sign In - Expense Tracker{% endblock %}

{% block auth_content %}
<div class="auth-card mx-auto">
    <div class="auth-brand">
        <div class="brand-logo">
            <i class="bi bi-wallet2"></i>
        </div>
        <h3 class="fw-bold text-dark">Welcome Back</h3>
        <p class="text-muted small">Sign in to access your financial dashboard</p>
    </div>

    <form action="{{ url_for('auth.login') }}" method="POST" class="needs-validation" novalidate>
        <div class="mb-3">
            <label for="email" class="form-label fw-semibold small text-uppercase">Email Address</label>

            <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required>
            </div>
        </div>

        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label fw-semibold small text-uppercase mb-0">Password</label>
            </div>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>

        <div class="text-center">
            <span class="text-muted small">Don't have an account?</span>
            <a href="{{ url_for('auth.register') }}" class="text-primary fw-semibold small ms-1">Create Account</a>
        </div>
    </form>
</div>
{% endblock %}
