{% extends "base.html" %}

{% block title %}Create Account - Expense Tracker{% endblock %}

{% block auth_content %}
<div class="auth-card mx-auto">
    <div class="auth-brand">
        <div class="brand-logo">
            <i class="bi bi-wallet2"></i>
        </div>
        <h3 class="fw-bold text-dark">Create Account</h3>
        <p class="text-muted small">Start managing your personal finances today</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST" class="needs-validation">
        <div class="mb-3">
            <label for="name" class="form-label fw-semibold small text-uppercase">Full Name</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control border-start-0 ps-0" id="name" name="name" value="{{ name or '' }}" placeholder="John Doe" required>
            </div>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label fw-semibold small text-uppercase">Email Address</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required>
            </div>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label fw-semibold small text-uppercase">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
            </div>
        </div>

        <div class="mb-4">
            <label for="confirm_password" class="form-label fw-semibold small text-uppercase">Confirm Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-shield-lock"></i></span>
                <input type="password" class="form-control border-start-0 ps-0" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required minlength="6">
            </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 mb-3">
            <i class="bi bi-person-plus me-1"></i> Register Now
        </button>

        <div class="text-center">
            <span class="text-muted small">Already have an account?</span>
            <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold small ms-1">Sign In</a>
        </div>
    </form>
</div>
{% endblock %}
